<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <title>Grocery List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f7f7f2', ink: '#20352c', leaf: '#416b51', mint: '#e6eee5',
            line: '#e6e7df', tomato: '#c75b43', muted: '#7d877e'
          },
          fontFamily: {
            display: ['Georgia', 'Times New Roman', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root { color-scheme: light; }
    * { -webkit-tap-highlight-color: transparent; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    input, button { font: inherit; }
    input { font-size: 16px !important; }
    .check-box { appearance: none; -webkit-appearance: none; width: 23px; height: 23px; flex: 0 0 23px; border: 1.5px solid #b9c2b6; border-radius: 50%; background: transparent; display: grid; place-items: center; }
    .check-box:checked { background: #416b51; border-color: #416b51; }
    .check-box:checked::after { content: ''; width: 6px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
    .drag-handle { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .category.is-dragging { opacity: .45; }
    .category.drop-target { border-top: 2px solid #416b51; }
    .category-heading { border-radius: 9999px; background: var(--group-tint); color: var(--group-color); }
    .move-picker { border: 1px solid #dce5d8; background: #f1f5ef; }
    .emoji-picker { border: 1px solid #dce5d8; background: #fffefa; box-shadow: 0 8px 20px rgb(32 53 44 / 12%); }
    .emoji-option { aspect-ratio: 1; }
    .check-box:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #a9c7aa; outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      .category { animation: arrive .35s ease both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased selection:bg-mint">
  <main class="mx-auto w-full max-w-xl px-5 pb-10 sm:px-8">
    <header class="pt-7 pb-6">
      <div class="flex items-center justify-between">
        <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-leaf">The weekly shop</p>
        <span id="item-count" class="rounded-full bg-mint px-3 py-1.5 text-xs font-medium text-leaf" aria-live="polite">0 items</span>
      </div>
      <div class="mt-3 flex items-end justify-between gap-3">
        <div class="flex min-w-0 items-center gap-2">
          <div class="relative shrink-0">
            <button id="list-emoji" type="button" class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#e8e4d7] text-[23px]" aria-label="Edit list emoji" aria-expanded="false" title="Edit list emoji"></button>
            <div id="list-emoji-picker" class="emoji-picker absolute left-0 top-14 z-10 hidden w-52 rounded-xl p-2" role="group" aria-label="Choose list emoji"></div>
          </div>
          <div class="min-w-0">
            <label class="sr-only" for="list-select">Current list</label>
            <select id="list-select" class="min-h-11 max-w-[250px] min-w-0 bg-transparent pr-7 font-display text-[38px] leading-[1.05] text-ink outline-none"></select>
            <p id="today" class="mt-2 text-sm text-muted"></p>
          </div>
        </div>
      </div>
      <div id="list-actions" class="mt-1"></div>
    </header>

    <section id="meal-plan-section" class="mb-5 rounded-xl border border-[#dce5d8] bg-[#eef3eb] px-4 py-3" aria-labelledby="meal-plan-heading">
      <div class="flex items-center justify-between gap-3">
        <span id="meal-plan-heading" class="min-w-0 flex-1 cursor-pointer font-display text-xl text-ink" role="button" tabindex="0" title="Tap to rename">This week's meals</span>
        <button id="meal-plan-toggle" type="button" class="flex min-h-12 shrink-0 items-center gap-2 text-left" aria-expanded="true" aria-controls="meal-plan-content">
          <span id="meal-plan-count" class="text-xs text-muted"></span>
          <span id="meal-plan-chevron" class="text-lg text-leaf" aria-hidden="true">⌄</span>
        </button>
        <div class="flex shrink-0 items-center gap-1">
          <button type="button" class="min-h-11 rounded-lg px-2 text-xs font-medium text-muted" data-action="remove-meals" aria-label="Remove meal section">Remove</button>
        </div>
      </div>
      <div id="meal-plan-content">
        <div class="mb-1 flex justify-end">
          <span id="meal-plan-status" class="text-xs text-muted" aria-live="polite">Saved on this device</span>
        </div>
        <div id="meal-list" class="divide-y divide-[#dce5d8]"></div>
        <div id="meal-add-area" class="mt-1">
          <button type="button" class="flex min-h-[48px] items-center gap-3 text-sm text-muted" data-action="open-meal-add">
            <span class="flex h-6 w-6 items-center justify-center rounded-full border border-[#cbd2c8] text-[19px] leading-none text-leaf" aria-hidden="true">+</span>
            <span>Add a meal</span>
          </button>
        </div>
      </div>
    </section>

    <div id="categories" class="divide-y divide-line border-y border-line" aria-label="Grocery categories"></div>
    <div id="add-category-area" class="py-2">
      <button type="button" class="flex min-h-[48px] items-center gap-3 rounded-lg border border-leaf/35 bg-mint px-3 text-sm font-semibold text-leaf" data-action="open-category-add">
        <span class="flex h-6 w-6 items-center justify-center rounded-md bg-leaf text-[19px] leading-none text-white" aria-hidden="true">+</span>
        <span>Add group</span>
      </button>
    </div>
    <div class="mt-5">
      <button id="delete-list-button" type="button" class="min-h-11 px-1 text-sm font-medium text-tomato underline decoration-tomato/40 underline-offset-4" aria-label="Delete this list">- Delete this list</button>
    </div>

    <footer class="flex items-center justify-between py-5 text-xs text-muted">
      <span>Saved on this device</span>
      <button id="clear-done" type="button" class="hidden min-h-11 px-2 font-medium text-leaf underline decoration-leaf/40 underline-offset-4">Clear checked items</button>
    </footer>
  </main>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'market-list-v1';
      const NEW_LIST_VALUE = '__new-list__';
      const ARCHIVE_RETENTION_MS = 30 * 24 * 60 * 60 * 1000;
      const CATEGORIES = [
        { name: 'Produce', defaults: ['apples', 'onion', 'potatoes'] },
        { name: 'Deli', defaults: ['ham'] },
        { name: 'Pantry Staples', defaults: ['flour', 'sugar'] },
        { name: 'Frozen', defaults: [] },
        { name: 'Meat', defaults: [] },
        { name: 'Dairy', defaults: [] },
        { name: 'Household', defaults: [] }
      ];
      const CATEGORY_PALETTE = [
        { color: '#416b51', tint: '#e6eee5' },
        { color: '#a64f3b', tint: '#f5e8e2' },
        { color: '#80652f', tint: '#f1eddf' },
        { color: '#36736d', tint: '#e2efec' },
        { color: '#536e91', tint: '#e7ecf2' },
        { color: '#765a46', tint: '#efe8e1' },
        { color: '#687342', tint: '#edf0e2' }
      ];
      const randomColorIndex = () => Math.floor(Math.random() * CATEGORY_PALETTE.length);
      const chooseUnusedColorIndex = used => {
        const unused = CATEGORY_PALETTE.map((_, index) => index).filter(index => !used.has(index));
        return unused.length ? unused[Math.floor(Math.random() * unused.length)] : randomColorIndex();
      };

      const makeId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const makeList = (name, includeDefaults = false) => ({
        id: makeId(),
        name,
        emoji: '🥬',
        active: includeDefaults ? CATEGORIES.flatMap(({ name: category, defaults }) => defaults.map(label => ({ id: makeId(), label, category }))) : [],
        archive: [],
        categories: CATEGORIES.map(({ name: category }) => category),
        categoryOrder: CATEGORIES.map(({ name: category }) => category),
        categoryColors: Object.fromEntries(CATEGORIES.map(({ name: category }) => [category, randomColorIndex()])),
        meals: [],
        mealsCollapsed: false,
        mealsEnabled: true,
        mealsTitle: "This week's meals"
      });
      const makeInitialState = () => {
        const list = makeList('Grocery list', true);
        return { lists: [list], selectedListId: list.id };
      };

      function normalizeList(list) {
        list.id ||= makeId();
        list.name = typeof list.name === 'string' && list.name.trim() ? list.name.trim() : 'Grocery list';
        list.emoji = typeof list.emoji === 'string' && list.emoji.trim() ? list.emoji.trim() : '🥬';
        list.active = Array.isArray(list.active) ? list.active : [];
        list.archive = Array.isArray(list.archive) ? list.archive : [];
        list.meals = Array.isArray(list.meals) ? list.meals.filter(meal => meal && typeof meal.label === 'string').map(meal => ({ id: meal.id || makeId(), label: meal.label })) : [];
        list.mealsCollapsed = list.mealsCollapsed === true;
        list.mealsEnabled = list.mealsEnabled !== false;
        list.mealsTitle = typeof list.mealsTitle === 'string' && list.mealsTitle.trim() ? list.mealsTitle.trim() : "This week's meals";
        list.categories = [...new Set((Array.isArray(list.categories) ? list.categories : CATEGORIES.map(({ name }) => name)).filter(name => typeof name === 'string' && name.trim()))];
        list.categoryColors = list.categoryColors && typeof list.categoryColors === 'object' ? list.categoryColors : {};
        const usedColors = new Set();
        list.categories.forEach(name => {
          const colorIndex = list.categoryColors[name];
          if (!Number.isInteger(colorIndex) || colorIndex < 0 || colorIndex >= CATEGORY_PALETTE.length || usedColors.has(colorIndex)) list.categoryColors[name] = chooseUnusedColorIndex(usedColors);
          usedColors.add(list.categoryColors[name]);
        });
        [...list.active, ...list.archive].forEach(item => {
          if (typeof item.category === 'string' && item.category.trim() && !list.categories.includes(item.category)) list.categories.push(item.category);
        });
        const savedOrder = Array.isArray(list.categoryOrder) ? list.categoryOrder : [];
        list.categoryOrder = [...new Set(savedOrder.filter(name => list.categories.includes(name))), ...list.categories.filter(name => !savedOrder.includes(name))];
        return list;
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return makeInitialState();
          const parsed = JSON.parse(stored);
          const cutoff = Date.now() - ARCHIVE_RETENTION_MS;
          if (!Array.isArray(parsed.lists)) {
            const legacy = normalizeList({ ...parsed, id: makeId(), name: 'Grocery list' });
            legacy.archive = legacy.archive.filter(item => Number.isFinite(item.archivedAt) && item.archivedAt >= cutoff);
            return { lists: [legacy], selectedListId: legacy.id };
          }
          parsed.lists = parsed.lists.map(normalizeList);
          parsed.lists.forEach(list => { list.archive = list.archive.filter(item => Number.isFinite(item.archivedAt) && item.archivedAt >= cutoff); });
          if (!parsed.lists.length) return makeInitialState();
          if (!parsed.lists.some(list => list.id === parsed.selectedListId)) parsed.selectedListId = parsed.lists[0].id;
          return parsed;
        } catch (error) {
          console.error('Could not load the grocery list.', error);
          return makeInitialState();
        }
      }

      let state = loadState();
      const currentList = () => state.lists.find(list => list.id === state.selectedListId) || state.lists[0];
      const categoriesEl = document.querySelector('#categories');
      const countEl = document.querySelector('#item-count');
      const clearDoneButton = document.querySelector('#clear-done');
      const mealsEl = document.querySelector('#meal-list');
      const mealAddArea = document.querySelector('#meal-add-area');
      const mealPlanStatus = document.querySelector('#meal-plan-status');
      const mealPlanToggle = document.querySelector('#meal-plan-toggle');
      const mealPlanContent = document.querySelector('#meal-plan-content');
      const mealPlanCount = document.querySelector('#meal-plan-count');
      const mealPlanChevron = document.querySelector('#meal-plan-chevron');
      const mealPlanSection = document.querySelector('#meal-plan-section');
      const listSelect = document.querySelector('#list-select');
      const listActions = document.querySelector('#list-actions');
      const listEmoji = document.querySelector('#list-emoji');
      const listEmojiPicker = document.querySelector('#list-emoji-picker');
      const EMOJI_GROUPS = [
        { name: 'Food & groceries', emojis: [
          ['🥬', 'lettuce'], ['🥦', 'broccoli'], ['🥕', 'carrot'], ['🌽', 'corn'], ['🥔', 'potato'], ['🍅', 'tomato'], ['🧅', 'onion'], ['🧄', 'garlic'], ['🍎', 'apple'], ['🍏', 'green apple'], ['🍐', 'pear'], ['🍊', 'orange'], ['🍋', 'lemon'], ['🍌', 'banana'], ['🍉', 'watermelon'], ['🍇', 'grapes'], ['🍓', 'strawberry'], ['🫐', 'blueberries'], ['🥑', 'avocado'], ['🍞', 'bread'], ['🥐', 'croissant'], ['🥯', 'bagel'], ['🥨', 'pretzel'], ['🧀', 'cheese'], ['🥚', 'egg'], ['🥓', 'bacon'], ['🥩', 'steak'], ['🍗', 'chicken'], ['🌭', 'hot dog'], ['🍔', 'hamburger'], ['🍕', 'pizza'], ['🌮', 'taco'], ['🍜', 'noodles'], ['🍚', 'rice'], ['🥫', 'canned food'], ['🧈', 'butter'], ['🍯', 'honey'], ['🧂', 'salt'], ['🍿', 'popcorn'], ['🍪', 'cookie'], ['🍰', 'cake'], ['🍫', 'chocolate'], ['🍦', 'ice cream'], ['☕', 'coffee'], ['🫖', 'tea'], ['🧃', 'juice'], ['🥛', 'milk'], ['🍺', 'beer'], ['🍷', 'wine']
        ]},
        { name: 'Shopping & stores', emojis: [
          ['🛒', 'shopping cart'], ['🛍️', 'shopping bags'], ['🧺', 'basket'], ['🏪', 'convenience store'], ['🏬', 'department store'], ['🏫', 'store'], ['🏷️', 'label'], ['💳', 'credit card'], ['💵', 'money'], ['🧾', 'receipt'], ['📦', 'package'], ['📫', 'mailbox'], ['🚚', 'delivery truck'], ['🛻', 'pickup truck'], ['🧹', 'broom'], ['🧽', 'sponge'], ['🧻', 'toilet paper'], ['🧼', 'soap'], ['🪣', 'bucket'], ['🔑', 'key'], ['🛠️', 'tools']
        ]},
        { name: 'Symbols', emojis: [
          ['❗', 'exclamation mark'], ['❓', 'question mark'], ['‼️', 'double exclamation'], ['⁉️', 'exclamation question'], ['⭐', 'star'], ['🌟', 'glowing star'], ['✨', 'sparkles'], ['💡', 'idea'], ['✅', 'check mark'], ['❌', 'cross mark'], ['➕', 'plus'], ['➖', 'minus'], ['✖️', 'multiply'], ['➗', 'divide'], ['⭕', 'circle'], ['⚠️', 'warning'], ['🔔', 'bell'], ['❤️', 'heart'], ['💚', 'green heart'], ['*️⃣', 'asterisk'], ['#️⃣', 'number sign'], ['©️', 'copyright'], ['™️', 'trademark']
        ]},
        { name: 'Flags', emojis: [
          ['🇺🇸', 'United States flag'], ['🇨🇦', 'Canada flag'], ['🇲🇽', 'Mexico flag'], ['🇬🇧', 'United Kingdom flag'], ['🇮🇪', 'Ireland flag'], ['🇫🇷', 'France flag'], ['🇩🇪', 'Germany flag'], ['🇮🇹', 'Italy flag'], ['🇪🇸', 'Spain flag'], ['🇵🇹', 'Portugal flag'], ['🇳🇱', 'Netherlands flag'], ['🇸🇪', 'Sweden flag'], ['🇳🇴', 'Norway flag'], ['🇩🇰', 'Denmark flag'], ['🇫🇮', 'Finland flag'], ['🇨🇭', 'Switzerland flag'], ['🇦🇺', 'Australia flag'], ['🇳🇿', 'New Zealand flag'], ['🇯🇵', 'Japan flag'], ['🇰🇷', 'South Korea flag'], ['🇨🇳', 'China flag'], ['🇮🇳', 'India flag'], ['🇧🇷', 'Brazil flag'], ['🇦🇷', 'Argentina flag'], ['🇿🇦', 'South Africa flag'], ['🇪🇺', 'European Union flag']
        ]}
      ];
      const ALL_EMOJIS = EMOJI_GROUPS.flatMap(group => group.emojis);
      let emojiCategory = 'All';
      let dragState = null;
      let itemDragState = null;

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          console.error('Could not save the grocery list.', error);
        }
      }

      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

      function render() {
        const list = currentList();
        listSelect.innerHTML = `${state.lists.map(entry => `<option value="${escapeHtml(entry.id)}">${escapeHtml(entry.name)}</option>`).join('')}<option value="${NEW_LIST_VALUE}">+ New List</option>`;
        listSelect.value = list.id;
        listEmoji.textContent = list.emoji;
        listActions.innerHTML = list.mealsEnabled ? '' : '<button type="button" class="min-h-11 px-1 text-sm font-medium text-leaf underline decoration-leaf/40 underline-offset-4" data-action="add-meals">+ Add header section</button>';
        const activeCount = list.active.length;
        countEl.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'}`;
        clearDoneButton.classList.toggle('hidden', list.archive.length === 0);
        renderMeals();

        categoriesEl.innerHTML = list.categoryOrder.map((name, index) => {
          const color = CATEGORY_PALETTE[list.categoryColors[name]];
          const items = list.active.filter(item => item.category === name);
          const rows = items.map(item => `
            <div class="item-row group flex min-h-[52px] items-center gap-2 border-b border-line/70 px-1" draggable="true" data-id="${escapeHtml(item.id)}" data-category="${escapeHtml(name)}">
              <input class="check-box" type="checkbox" aria-label="Check off ${escapeHtml(item.label)}" data-action="archive" data-id="${escapeHtml(item.id)}">
              <button type="button" class="flex min-h-[48px] min-w-0 flex-1 items-center text-left text-[16px] text-ink" data-action="edit" data-id="${escapeHtml(item.id)}">${escapeHtml(item.label)}</button>
              <button type="button" class="min-h-11 shrink-0 px-1 text-xs font-medium text-leaf opacity-70" data-action="move" data-id="${escapeHtml(item.id)}" aria-label="Move ${escapeHtml(item.label)}" title="Move item">Move</button>
            </div>`).join('');

          return `
            <section class="category py-4" style="animation-delay:${index * 35}ms" data-category="${escapeHtml(name)}" aria-label="${escapeHtml(name)}">
              <div class="mb-1 flex items-center justify-between px-1">
                <div class="flex min-w-0 items-center gap-2">
                  <button type="button" class="drag-handle flex h-11 w-8 shrink-0 items-center justify-center rounded-lg text-muted" data-action="drag" aria-label="Reorder ${escapeHtml(name)}" title="Drag to reorder">
                    <span class="grid grid-cols-2 gap-[3px]" aria-hidden="true">${'<i class="h-[3px] w-[3px] rounded-full bg-current"></i>'.repeat(6)}</span>
                  </button>
                  <h2 id="heading-${index}">
                    <button type="button" class="category-heading min-h-11 px-3 text-left text-[11px] font-semibold uppercase tracking-[0.16em]" style="--group-color:${color.color};--group-tint:${color.tint}" data-action="rename" aria-label="Rename ${escapeHtml(name)}" title="Tap to rename">${escapeHtml(name)}</button>
                  </h2>
                </div>
                <span class="text-xs tabular-nums text-muted">${items.length}</span>
              </div>
              <div>${rows}</div>
              <div class="add-area mt-1" data-category="${escapeHtml(name)}">
                <button type="button" class="flex min-h-[48px] w-full items-center gap-3 px-1 text-left text-sm text-muted" data-action="open-add" aria-label="Add item to ${escapeHtml(name)}">
                  <span class="flex h-6 w-6 items-center justify-center rounded-full border border-[#cbd2c8] text-[19px] leading-none text-leaf" aria-hidden="true">+</span>
                  <span>Add an item</span>
                </button>
              </div>
            </section>`;
        }).join('');
      }

      function renderMeals() {
        const list = currentList();
        mealPlanSection.hidden = !list.mealsEnabled;
        document.querySelector('#meal-plan-heading').textContent = list.mealsTitle;
        const count = list.meals.length;
        mealPlanCount.textContent = `${count} ${count === 1 ? 'meal' : 'meals'}`;
        mealPlanToggle.setAttribute('aria-expanded', String(!list.mealsCollapsed));
        mealPlanContent.hidden = list.mealsCollapsed;
        mealPlanChevron.textContent = list.mealsCollapsed ? '›' : '⌄';
        mealsEl.innerHTML = list.meals.map(meal => `
          <div class="flex min-h-[48px] items-center gap-2">
            <button type="button" class="min-h-[48px] min-w-0 flex-1 py-2 text-left text-[16px] text-ink" data-action="edit-meal" data-id="${escapeHtml(meal.id)}">${escapeHtml(meal.label)}</button>
            <button type="button" class="min-h-11 min-w-11 rounded-lg text-lg text-muted" data-action="delete-meal" data-id="${escapeHtml(meal.id)}" aria-label="Delete ${escapeHtml(meal.label)}" title="Delete meal">&times;</button>
          </div>`).join('');
      }

      function renameMeals() {
        const list = currentList();
        if (mealPlanSection.querySelector('input')) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = list.mealsTitle;
        input.maxLength = 60;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', 'Meal section name');
        input.className = 'min-h-11 min-w-0 flex-1 border-b border-leaf/40 bg-transparent font-display text-xl text-ink outline-none';
        document.querySelector('#meal-plan-heading').replaceWith(input);
        let saved = false;
        const finish = commit => {
          if (saved) return;
          saved = true;
          const title = input.value.trim();
          if (commit && title) list.mealsTitle = title;
          const heading = document.createElement('span');
          heading.id = 'meal-plan-heading';
          heading.className = 'font-display text-xl text-ink';
          heading.setAttribute('role', 'button');
          heading.setAttribute('tabindex', '0');
          heading.title = 'Tap to rename';
          heading.textContent = list.mealsTitle;
          input.replaceWith(heading);
          persist();
          render();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); finish(true); }
          if (event.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
        focusInput(input);
      }

      function startMealEditing(button) {
        const list = currentList();
        const meal = list.meals.find(entry => entry.id === button.dataset.id);
        if (!meal) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = meal.label;
        input.maxLength = 100;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `Edit ${meal.label}`);
        input.className = 'min-h-[48px] min-w-0 flex-1 border-0 bg-transparent py-2 text-ink outline-none';
        button.replaceWith(input);
        let saved = false;
        const finish = commit => {
          if (saved) return;
          saved = true;
          const label = input.value.trim();
          if (commit && label) meal.label = label;
          if (commit && label) persist();
          renderMeals();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); finish(true); }
          if (event.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
        focusInput(input);
      }

      function openMealAdd() {
        if (mealAddArea.querySelector('input')) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Add a meal';
        input.maxLength = 100;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', 'New meal');
        input.className = 'min-h-[48px] w-full border-b border-leaf/40 bg-transparent text-ink placeholder:text-muted/70 outline-none';
        mealAddArea.replaceChildren(input);
        const add = () => {
          const label = input.value.trim();
          if (!label) return;
          currentList().meals.push({ id: makeId(), label });
          persist();
          renderMeals();
          input.value = '';
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); add(); }
          if (event.key === 'Escape') render();
        });
        input.addEventListener('blur', () => {
          if (!input.value.trim() && input.isConnected) {
            mealAddArea.innerHTML = `
              <button type="button" class="flex min-h-[48px] items-center gap-3 text-sm text-muted" data-action="open-meal-add">
                <span class="flex h-6 w-6 items-center justify-center rounded-full border border-[#cbd2c8] text-[19px] leading-none text-leaf" aria-hidden="true">+</span>
                <span>Add a meal</span>
              </button>`;
          }
        });
        focusInput(input);
      }

      function finishReorder() {
        if (!dragState) return;
        dragState.section.classList.remove('is-dragging');
        categoriesEl.querySelectorAll('.drop-target').forEach(section => section.classList.remove('drop-target'));
        currentList().categoryOrder = [...categoriesEl.querySelectorAll('.category')].map(section => section.dataset.category);
        dragState = null;
        persist();
        render();
      }

      function focusInput(input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }

      function startEditing(button) {
        const list = currentList();
        const item = list.active.find(entry => entry.id === button.dataset.id);
        if (!item) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = item.label;
        input.maxLength = 80;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `Edit ${item.label}`);
        input.className = 'min-h-[48px] min-w-0 flex-1 border-0 bg-transparent px-0 text-ink outline-none';
        button.replaceWith(input);
        let saved = false;
        const save = () => {
          if (saved) return;
          saved = true;
          const nextLabel = input.value.trim();
          if (nextLabel) item.label = nextLabel;
          persist();
          render();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
          if (event.key === 'Escape') { input.value = item.label; input.blur(); }
        });
        input.addEventListener('blur', save);
        focusInput(input);
      }

      function startRename(button) {
        const list = currentList();
        const section = button.closest('.category');
        const oldName = section?.dataset.category;
        if (!oldName) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = oldName;
        input.maxLength = 40;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `Rename ${oldName}`);
        input.className = 'min-h-11 w-full min-w-0 border-b border-leaf/40 bg-transparent text-ink outline-none';
        button.replaceWith(input);
        let saved = false;
        const finish = commit => {
          if (saved) return;
          saved = true;
          const nextName = input.value.trim();
          const duplicate = list.categories.some(name => name !== oldName && name.toLocaleLowerCase() === nextName.toLocaleLowerCase());
          if (commit && nextName && !duplicate) {
            list.categories = list.categories.map(name => name === oldName ? nextName : name);
            list.categoryOrder = list.categoryOrder.map(name => name === oldName ? nextName : name);
            list.categoryColors[nextName] = list.categoryColors[oldName];
            delete list.categoryColors[oldName];
            [...list.active, ...list.archive].forEach(item => {
              if (item.category === oldName) item.category = nextName;
            });
            persist();
          }
          render();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); finish(true); }
          if (event.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
        focusInput(input);
      }

      function openCategoryAdd(area) {
        const list = currentList();
        if (area.querySelector('input')) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'New group name';
        input.maxLength = 40;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', 'New category name');
        input.className = 'min-h-11 w-full border-b border-leaf/40 bg-transparent px-1 text-ink placeholder:text-muted/70 outline-none';
        const status = document.createElement('p');
        status.className = 'px-1 pt-1 text-xs text-tomato';
        status.setAttribute('aria-live', 'polite');
        area.replaceChildren(input, status);
        let saved = false;
        const add = () => {
          if (saved) return;
          const name = input.value.trim();
          if (!name) return;
          if (list.categories.some(category => category.toLocaleLowerCase() === name.toLocaleLowerCase())) {
            status.textContent = 'A group with that name already exists.';
            return;
          }
          saved = true;
          list.categories.push(name);
          list.categoryOrder.push(name);
          list.categoryColors[name] = chooseUnusedColorIndex(new Set(Object.values(list.categoryColors)));
          persist();
          render();
          openCategoryAdd(document.querySelector('#add-category-area'));
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); add(); }
          if (event.key === 'Escape') render();
        });
        input.addEventListener('blur', () => {
          if (input.value.trim()) add();
          else if (input.isConnected) render();
        });
        focusInput(input);
      }

      function openListAdd() {
        if (listActions.querySelector('input')) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'New list name';
        input.maxLength = 40;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', 'New list name');
        input.className = 'min-h-11 w-full max-w-[280px] border-b border-leaf/40 bg-transparent text-ink placeholder:text-muted/70 outline-none';
        listActions.replaceChildren(input);
        let saved = false;
        const add = () => {
          if (saved) return;
          const name = input.value.trim();
          if (!name) return;
          if (state.lists.some(list => list.name.toLocaleLowerCase() === name.toLocaleLowerCase())) return;
          saved = true;
          const list = makeList(name);
          state.lists.push(list);
          state.selectedListId = list.id;
          persist();
          render();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); add(); }
          if (event.key === 'Escape') render();
        });
        input.addEventListener('blur', () => {
          if (input.value.trim()) add();
          else if (input.isConnected) render();
        });
        focusInput(input);
      }

      function deleteCurrentList() {
        if (state.lists.length === 1) return;
        const list = currentList();
        if (!confirm(`Delete "${list.name}" and all of its items?`)) {
          render();
          return;
        }
        state.lists = state.lists.filter(entry => entry.id !== list.id);
        state.selectedListId = state.lists[0].id;
        persist();
        render();
      }

      function openListEmojiEdit() {
        renderEmojiPicker();
        listEmojiPicker.classList.toggle('hidden');
        listEmoji.setAttribute('aria-expanded', String(!listEmojiPicker.classList.contains('hidden')));
      }

      function renderEmojiPicker(searchTerm = '') {
        const normalizedSearch = searchTerm.trim().toLocaleLowerCase();
        const groups = emojiCategory === 'All' ? [{ name: 'All', emojis: ALL_EMOJIS }] : EMOJI_GROUPS.filter(group => group.name === emojiCategory);
        const emojis = groups.flatMap(group => group.emojis).filter(([, label]) => !normalizedSearch || label.includes(normalizedSearch));
        if (!listEmojiPicker.querySelector('#emoji-search')) {
          listEmojiPicker.innerHTML = `
            <div class="mb-2 flex gap-2">
              <label class="sr-only" for="emoji-search">Search emojis</label>
              <input id="emoji-search" type="search" placeholder="Search emojis" autocomplete="off" class="min-h-10 min-w-0 flex-1 rounded-lg border border-[#cbd2c8] bg-paper px-3 text-sm text-ink outline-none">
            </div>
            <div class="mb-2 flex gap-1 overflow-x-auto pb-1" role="tablist" aria-label="Emoji categories">
              ${['All', ...EMOJI_GROUPS.map(group => group.name)].map(category => `<button type="button" class="shrink-0 rounded-md px-2 py-1 text-xs" data-emoji-category="${escapeHtml(category)}" role="tab" aria-selected="false">${escapeHtml(category)}</button>`).join('')}
            </div>
            <div id="emoji-options" class="grid max-h-[280px] grid-cols-6 gap-1 overflow-y-auto" role="listbox" aria-label="Emoji options"></div>`;
        }
        listEmojiPicker.querySelectorAll('[data-emoji-category]').forEach(button => {
          const selected = button.dataset.emojiCategory === emojiCategory;
          button.classList.toggle('bg-mint', selected);
          button.classList.toggle('font-semibold', selected);
          button.classList.toggle('text-leaf', selected);
          button.classList.toggle('text-muted', !selected);
          button.setAttribute('aria-selected', String(selected));
        });
        listEmojiPicker.querySelector('#emoji-options').innerHTML = emojis.length
          ? emojis.map(([emoji, label]) => `<button type="button" class="emoji-option rounded-lg text-xl hover:bg-mint" data-emoji="${emoji}" aria-label="Use ${escapeHtml(label)}" title="${escapeHtml(label)}" role="option">${emoji}</button>`).join('')
          : '<p class="col-span-6 px-2 py-4 text-center text-sm text-muted">No matching emojis</p>';
      }

      function closeListEmojiEdit() {
        listEmojiPicker.classList.add('hidden');
        listEmoji.setAttribute('aria-expanded', 'false');
      }

      function updateMoveGroups(groupSelect, listId) {
        const list = state.lists.find(entry => entry.id === listId);
        groupSelect.innerHTML = (list?.categoryOrder || []).map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join('');
      }

      function moveItem(itemId, destinationListId, category) {
        const source = currentList();
        const destination = state.lists.find(list => list.id === destinationListId);
        const index = source.active.findIndex(item => item.id === itemId);
        if (!destination || index === -1 || !category) return;
        if (source === destination && source.active[index].category === category) return;
        const [item] = source.active.splice(index, 1);
        item.category = category;
        destination.active.push(item);
        persist();
        render();
      }

      function openMovePicker(button) {
        const row = button.closest('.item-row');
        if (!row || row.nextElementSibling?.classList.contains('move-picker')) return;
        const destinations = state.lists;
        const panel = document.createElement('div');
        panel.className = 'move-picker flex flex-wrap items-center gap-2 px-1 py-3';
        panel.innerHTML = `
          <label class="sr-only" for="move-list-${button.dataset.id}">Move to list</label>
          <select id="move-list-${button.dataset.id}" class="min-h-10 min-w-0 flex-1 rounded-md border border-[#cbd2c8] bg-paper px-2 text-sm text-ink" data-move-list>
            ${destinations.map(list => `<option value="${escapeHtml(list.id)}"${list.id === currentList().id ? ' selected' : ''}>${escapeHtml(list.name)}</option>`).join('')}
          </select>
          <label class="sr-only" for="move-group-${button.dataset.id}">Move to group</label>
          <select id="move-group-${button.dataset.id}" class="min-h-10 min-w-0 flex-1 rounded-md border border-[#cbd2c8] bg-paper px-2 text-sm text-ink" data-move-group></select>
          <button type="button" class="min-h-10 rounded-md bg-leaf px-3 text-sm font-medium text-white" data-action="confirm-move" data-id="${escapeHtml(button.dataset.id)}">Move</button>
          <button type="button" class="min-h-10 px-2 text-sm text-muted" data-action="cancel-move">Cancel</button>`;
        row.insertAdjacentElement('afterend', panel);
        const listSelect = panel.querySelector('[data-move-list]');
        const groupSelect = panel.querySelector('[data-move-group]');
        updateMoveGroups(groupSelect, listSelect.value);
        groupSelect.value = row.dataset.category;
        listSelect.addEventListener('change', () => updateMoveGroups(groupSelect, listSelect.value));
      }

      function openAdd(area) {
        const list = currentList();
        if (area.querySelector('input')) return;
        const category = area.dataset.category;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Add an item';
        input.maxLength = 80;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `New item in ${category}`);
        input.className = 'min-h-[48px] w-full border-0 border-b border-leaf/40 bg-transparent px-1 text-ink placeholder:text-muted/70 outline-none';
        area.innerHTML = '';
        area.append(input);

        const addItem = () => {
          const label = input.value.trim();
          if (!label) return;
          list.active.push({ id: makeId(), label, category });
          persist();
          render();
          const nextArea = [...categoriesEl.querySelectorAll('.add-area')].find(element => element.dataset.category === category);
          openAdd(nextArea);
        };

        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); addItem(); }
          if (event.key === 'Escape') render();
        });
        input.addEventListener('blur', () => {
          if (!input.value.trim() && input.isConnected) render();
        });
        focusInput(input);
      }

      categoriesEl.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        if (target.dataset.action === 'edit') startEditing(target);
        if (target.dataset.action === 'rename') startRename(target);
        if (target.dataset.action === 'open-add') openAdd(target.closest('.add-area'));
        if (target.dataset.action === 'move') openMovePicker(target);
        if (target.dataset.action === 'cancel-move') target.closest('.move-picker')?.remove();
        if (target.dataset.action === 'confirm-move') {
          const panel = target.closest('.move-picker');
          moveItem(target.dataset.id, panel.querySelector('[data-move-list]').value, panel.querySelector('[data-move-group]').value);
        }
      });

      listSelect.addEventListener('change', () => {
        if (listSelect.value === NEW_LIST_VALUE) {
          openListAdd();
          return;
        }
        state.selectedListId = listSelect.value;
        persist();
        render();
      });

      listActions.addEventListener('click', event => {
        if (event.target.closest('[data-action="open-list-add"]')) openListAdd();
      });

      listEmoji.addEventListener('click', openListEmojiEdit);

      document.querySelector('#delete-list-button').addEventListener('click', deleteCurrentList);

      listEmojiPicker.addEventListener('input', event => {
        if (event.target.id === 'emoji-search') renderEmojiPicker(event.target.value);
      });

      listEmojiPicker.addEventListener('click', event => {
        const categoryButton = event.target.closest('[data-emoji-category]');
        if (categoryButton) {
          emojiCategory = categoryButton.dataset.emojiCategory;
          renderEmojiPicker(listEmojiPicker.querySelector('#emoji-search')?.value || '');
          return;
        }
        const emojiButton = event.target.closest('[data-emoji]');
        if (!emojiButton) return;
        currentList().emoji = emojiButton.dataset.emoji;
        persist();
        closeListEmojiEdit();
        render();
      });

      document.addEventListener('click', event => {
        if (listEmojiPicker.classList.contains('hidden')) return;
        if (event.target.closest('#list-emoji') || event.target.closest('#list-emoji-picker')) return;
        closeListEmojiEdit();
      });

      document.querySelector('#add-category-area').addEventListener('click', event => {
        if (event.target.closest('[data-action="open-category-add"]')) openCategoryAdd(event.currentTarget);
      });

      mealsEl.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        if (target.dataset.action === 'edit-meal') startMealEditing(target);
        if (target.dataset.action === 'delete-meal') {
          const list = currentList();
          list.meals = list.meals.filter(meal => meal.id !== target.dataset.id);
          persist();
          renderMeals();
        }
      });

      mealAddArea.addEventListener('click', event => {
        if (event.target.closest('[data-action="open-meal-add"]')) openMealAdd();
      });

      mealPlanSection.addEventListener('click', event => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (action === 'remove-meals') {
          currentList().mealsEnabled = false;
          persist();
          render();
        }
      });

      mealPlanSection.addEventListener('click', event => {
        if (event.target.closest('#meal-plan-heading')) {
          event.stopPropagation();
          renameMeals();
        }
      }, true);

      mealPlanSection.addEventListener('keydown', event => {
        if (event.target.closest('#meal-plan-heading') && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          renameMeals();
        }
      });

      listActions.addEventListener('click', event => {
        if (event.target.closest('[data-action="add-meals"]')) {
          currentList().mealsEnabled = true;
          persist();
          render();
        }
      });

      mealPlanToggle.addEventListener('click', () => {
        const list = currentList();
        list.mealsCollapsed = !list.mealsCollapsed;
        persist();
        renderMeals();
      });

      categoriesEl.addEventListener('pointerdown', event => {
        const handle = event.target.closest('[data-action="drag"]');
        if (!handle || event.button !== 0) return;
        const section = handle.closest('.category');
        if (!section) return;
        event.preventDefault();
        dragState = { section, pointerId: event.pointerId, handle };
        section.classList.add('is-dragging');
        handle.setPointerCapture(event.pointerId);
      });

      categoriesEl.addEventListener('pointermove', event => {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        const sections = [...categoriesEl.querySelectorAll('.category')].filter(section => section !== dragState.section);
        const nextSection = sections.find(section => event.clientY < section.getBoundingClientRect().top + section.getBoundingClientRect().height / 2);
        categoriesEl.querySelectorAll('.drop-target').forEach(section => section.classList.remove('drop-target'));
        if (nextSection) {
          categoriesEl.insertBefore(dragState.section, nextSection);
          nextSection.classList.add('drop-target');
        } else {
          categoriesEl.append(dragState.section);
          sections.at(-1)?.classList.add('drop-target');
        }
        const edge = 64;
        if (event.clientY < edge) window.scrollBy(0, -12);
        else if (event.clientY > window.innerHeight - edge) window.scrollBy(0, 12);
      });

      categoriesEl.addEventListener('pointerup', event => {
        if (dragState && event.pointerId === dragState.pointerId) finishReorder();
      });

      categoriesEl.addEventListener('pointercancel', event => {
        if (dragState && event.pointerId === dragState.pointerId) finishReorder();
      });

      categoriesEl.addEventListener('dragstart', event => {
        const row = event.target.closest('.item-row');
        if (!row) return;
        itemDragState = { itemId: row.dataset.id };
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', row.dataset.id);
        row.classList.add('opacity-40');
      });

      categoriesEl.addEventListener('dragover', event => {
        if (!itemDragState) return;
        const section = event.target.closest('.category');
        if (!section) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        categoriesEl.querySelectorAll('.drop-target').forEach(element => element.classList.remove('drop-target'));
        section.classList.add('drop-target');
      });

      categoriesEl.addEventListener('dragenter', event => {
        if (!itemDragState) return;
        const section = event.target.closest('.category');
        if (!section) return;
        event.preventDefault();
        section.classList.add('drop-target');
      });

      categoriesEl.addEventListener('drop', event => {
        if (!itemDragState) return;
        const section = event.target.closest('.category');
        if (!section) return;
        event.preventDefault();
        const item = currentList().active.find(entry => entry.id === itemDragState.itemId);
        if (item && item.category !== section.dataset.category) {
          item.category = section.dataset.category;
          persist();
          render();
        }
        itemDragState = null;
        categoriesEl.querySelectorAll('.drop-target').forEach(element => element.classList.remove('drop-target'));
      });

      categoriesEl.addEventListener('dragend', event => {
        const row = event.target.closest('.item-row');
        if (row) row.classList.remove('opacity-40');
        itemDragState = null;
        categoriesEl.querySelectorAll('.drop-target').forEach(element => element.classList.remove('drop-target'));
      });

      categoriesEl.addEventListener('change', event => {
        const checkbox = event.target.closest('input[data-action="archive"]');
        if (!checkbox?.checked) return;
        const list = currentList();
        const index = list.active.findIndex(item => item.id === checkbox.dataset.id);
        if (index === -1) return;
        const [item] = list.active.splice(index, 1);
        item.checked = true;
        item.archivedAt = Date.now();
        list.archive.push(item);
        persist();
        render();
      });

      clearDoneButton.addEventListener('click', () => {
        currentList().archive = [];
        persist();
        render();
      });

      document.querySelector('#today').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());
      persist();
      render();
    })();
  </script>
