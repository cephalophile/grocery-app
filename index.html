<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <title>Grocery List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f7f7f2', ink: '#20352c', leaf: '#416b51', mint: '#e6eee5',
            line: '#e6e7df', tomato: '#c75b43', muted: '#7d877e'
          },
          fontFamily: {
            display: ['Georgia', 'Times New Roman', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root { color-scheme: light; }
    * { -webkit-tap-highlight-color: transparent; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    input, button { font: inherit; }
    input { font-size: 16px !important; }
    .check-box { appearance: none; -webkit-appearance: none; width: 23px; height: 23px; flex: 0 0 23px; border: 1.5px solid #b9c2b6; border-radius: 50%; background: transparent; display: grid; place-items: center; }
    .check-box:checked { background: #416b51; border-color: #416b51; }
    .check-box:checked::after { content: ''; width: 6px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
    .drag-handle { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .category.is-dragging { opacity: .45; }
    .category.drop-target { border-top: 2px solid #416b51; }
    .category-heading { border-radius: 9999px; background: var(--group-tint); color: var(--group-color); }
    .check-box:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #a9c7aa; outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      .category { animation: arrive .35s ease both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased selection:bg-mint">
  <main class="mx-auto w-full max-w-xl px-5 pb-10 sm:px-8">
    <header class="pt-7 pb-6">
      <div class="flex items-center justify-between">
        <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-leaf">The weekly shop</p>
        <span id="item-count" class="rounded-full bg-mint px-3 py-1.5 text-xs font-medium text-leaf" aria-live="polite">0 items</span>
      </div>
      <div class="mt-3 flex items-end justify-between gap-3">
        <div>
          <h1 class="font-display text-[38px] leading-[1.05] text-ink">Grocery list<span class="text-tomato">.</span></h1>
          <p id="today" class="mt-2 text-sm text-muted"></p>
        </div>
        <div class="mb-1 flex h-12 w-12 items-center justify-center rounded-2xl bg-[#e8e4d7] text-[23px]" aria-hidden="true">🥬</div>
      </div>
    </header>

    <section class="mb-5 rounded-xl border border-[#dce5d8] bg-[#eef3eb] px-4 py-3" aria-labelledby="meal-plan-heading">
      <div class="flex items-center justify-between gap-3">
        <button id="meal-plan-toggle" type="button" class="flex min-h-12 min-w-0 flex-1 items-center justify-between gap-3 text-left" aria-expanded="true" aria-controls="meal-plan-content">
          <span id="meal-plan-heading" class="font-display text-xl text-ink">This week's meals</span>
          <span class="flex shrink-0 items-center gap-2">
            <span id="meal-plan-count" class="text-xs text-muted"></span>
            <span id="meal-plan-chevron" class="text-lg text-leaf" aria-hidden="true">⌄</span>
          </span>
        </button>
      </div>
      <div id="meal-plan-content">
        <div class="mb-1 flex justify-end">
          <span id="meal-plan-status" class="text-xs text-muted" aria-live="polite">Saved on this device</span>
        </div>
        <div id="meal-list" class="divide-y divide-[#dce5d8]"></div>
        <div id="meal-add-area" class="mt-1">
          <button type="button" class="flex min-h-[48px] items-center gap-3 text-sm text-muted" data-action="open-meal-add">
            <span class="flex h-6 w-6 items-center justify-center rounded-full border border-[#cbd2c8] text-[19px] leading-none text-leaf" aria-hidden="true">+</span>
            <span>Add a meal</span>
          </button>
        </div>
      </div>
    </section>

    <div id="categories" class="divide-y divide-line border-y border-line" aria-label="Grocery categories"></div>
    <div id="add-category-area" class="py-2">
      <button type="button" class="flex min-h-[48px] items-center gap-3 px-1 text-sm text-muted" data-action="open-category-add">
        <span class="flex h-6 w-6 items-center justify-center rounded-full border border-[#cbd2c8] text-[19px] leading-none text-leaf" aria-hidden="true">+</span>
        <span>Add a group</span>
      </button>
    </div>

    <footer class="flex items-center justify-between py-5 text-xs text-muted">
      <span>Saved on this device</span>
      <button id="clear-done" type="button" class="hidden min-h-11 px-2 font-medium text-leaf underline decoration-leaf/40 underline-offset-4">Clear checked items</button>
    </footer>
  </main>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'market-list-v1';
      const ARCHIVE_RETENTION_MS = 30 * 24 * 60 * 60 * 1000;
      const CATEGORIES = [
        { name: 'Produce', defaults: ['apples', 'onion', 'potatoes'] },
        { name: 'Deli', defaults: ['ham'] },
        { name: 'Pantry Staples', defaults: ['flour', 'sugar'] },
        { name: 'Frozen', defaults: [] },
        { name: 'Meat', defaults: [] },
        { name: 'Dairy', defaults: [] },
        { name: 'Household', defaults: [] }
      ];
      const CATEGORY_PALETTE = [
        { color: '#416b51', tint: '#e6eee5' },
        { color: '#a64f3b', tint: '#f5e8e2' },
        { color: '#80652f', tint: '#f1eddf' },
        { color: '#36736d', tint: '#e2efec' },
        { color: '#536e91', tint: '#e7ecf2' },
        { color: '#765a46', tint: '#efe8e1' },
        { color: '#687342', tint: '#edf0e2' }
      ];
      const randomColorIndex = () => Math.floor(Math.random() * CATEGORY_PALETTE.length);
      const chooseUnusedColorIndex = used => {
        const unused = CATEGORY_PALETTE.map((_, index) => index).filter(index => !used.has(index));
        return unused.length ? unused[Math.floor(Math.random() * unused.length)] : randomColorIndex();
      };

      const makeId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const makeInitialState = () => ({
        active: CATEGORIES.flatMap(({ name, defaults }) => defaults.map(label => ({ id: makeId(), label, category: name }))),
        archive: [],
        categories: CATEGORIES.map(({ name }) => name),
        categoryOrder: CATEGORIES.map(({ name }) => name),
        categoryColors: Object.fromEntries(CATEGORIES.map(({ name }) => [name, randomColorIndex()])),
        meals: [],
        mealsCollapsed: false
      });

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return makeInitialState();
          const parsed = JSON.parse(stored);
          if (!Array.isArray(parsed.active) || !Array.isArray(parsed.archive)) return makeInitialState();
          if (!Array.isArray(parsed.meals)) {
            parsed.meals = typeof parsed.mealPlan === 'string'
              ? parsed.mealPlan.split(/\r?\n/).map(meal => meal.trim()).filter(Boolean).map(label => ({ id: makeId(), label }))
              : [];
          }
          parsed.meals = parsed.meals.filter(meal => meal && typeof meal.label === 'string').map(meal => ({ id: meal.id || makeId(), label: meal.label }));
          parsed.mealsCollapsed = parsed.mealsCollapsed === true;
          delete parsed.mealPlan;
          const cutoff = Date.now() - ARCHIVE_RETENTION_MS;
          parsed.archive = parsed.archive.filter(item => Number.isFinite(item.archivedAt) && item.archivedAt >= cutoff);
          const storedCategories = Array.isArray(parsed.categories) ? parsed.categories : CATEGORIES.map(({ name }) => name);
          parsed.categories = [...new Set(storedCategories.filter(name => typeof name === 'string' && name.trim()))];
          parsed.categoryColors = parsed.categoryColors && typeof parsed.categoryColors === 'object' ? parsed.categoryColors : {};
          const usedColors = new Set();
          parsed.categories.forEach(name => {
            const colorIndex = parsed.categoryColors[name];
            if (!Number.isInteger(colorIndex) || colorIndex < 0 || colorIndex >= CATEGORY_PALETTE.length || usedColors.has(colorIndex)) {
              parsed.categoryColors[name] = chooseUnusedColorIndex(usedColors);
            }
            usedColors.add(parsed.categoryColors[name]);
          });
          [...parsed.active, ...parsed.archive].forEach(item => {
            if (typeof item.category === 'string' && item.category.trim() && !parsed.categories.includes(item.category)) parsed.categories.push(item.category);
          });
          const savedOrder = Array.isArray(parsed.categoryOrder) ? parsed.categoryOrder : [];
          parsed.categoryOrder = [...new Set(savedOrder.filter(name => parsed.categories.includes(name))), ...parsed.categories.filter(name => !savedOrder.includes(name))];
          return parsed;
        } catch (error) {
          console.error('Could not load the grocery list.', error);
          return makeInitialState();
        }
      }

      let state = loadState();
      const categoriesEl = document.querySelector('#categories');
      const countEl = document.querySelector('#item-count');
      const clearDoneButton = document.querySelector('#clear-done');
      const mealsEl = document.querySelector('#meal-list');
      const mealAddArea = document.querySelector('#meal-add-area');
      const mealPlanStatus = document.querySelector('#meal-plan-status');
      const mealPlanToggle = document.querySelector('#meal-plan-toggle');
      const mealPlanContent = document.querySelector('#meal-plan-content');
      const mealPlanCount = document.querySelector('#meal-plan-count');
      const mealPlanChevron = document.querySelector('#meal-plan-chevron');
      let dragState = null;

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          console.error('Could not save the grocery list.', error);
        }
      }

      const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

      function render() {
        const activeCount = state.active.length;
        countEl.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'}`;
        clearDoneButton.classList.toggle('hidden', state.archive.length === 0);
        renderMeals();

        categoriesEl.innerHTML = state.categoryOrder.map((name, index) => {
          const color = CATEGORY_PALETTE[state.categoryColors[name]];
          const items = state.active.filter(item => item.category === name);
          const rows = items.map(item => `
            <div class="group flex min-h-[52px] items-center gap-3 border-b border-line/70 px-1">
              <input class="check-box" type="checkbox" aria-label="Check off ${escapeHtml(item.label)}" data-action="archive" data-id="${escapeHtml(item.id)}">
              <button type="button" class="flex min-h-[48px] min-w-0 flex-1 items-center text-left text-[16px] text-ink" data-action="edit" data-id="${escapeHtml(item.id)}">${escapeHtml(item.label)}</button>
            </div>`).join('');

          return `
            <section class="category py-4" style="animation-delay:${index * 35}ms" data-category="${escapeHtml(name)}" aria-label="${escapeHtml(name)}">
              <div class="mb-1 flex items-center justify-between px-1">
                <div class="flex min-w-0 items-center gap-2">
                  <button type="button" class="drag-handle flex h-11 w-8 shrink-0 items-center justify-center rounded-lg text-muted" data-action="drag" aria-label="Reorder ${escapeHtml(name)}" title="Drag to reorder">
                    <span class="grid grid-cols-2 gap-[3px]" aria-hidden="true">${'<i class="h-[3px] w-[3px] rounded-full bg-current"></i>'.repeat(6)}</span>
                  </button>
                  <h2 id="heading-${index}">
                    <button type="button" class="category-heading min-h-11 px-3 text-left text-[11px] font-semibold uppercase tracking-[0.16em]" style="--group-color:${color.color};--group-tint:${color.tint}" data-action="rename" aria-label="Rename ${escapeHtml(name)}" title="Tap to rename">${escapeHtml(name)}</button>
                  </h2>
                </div>
                <span class="text-xs tabular-nums text-muted">${items.length}</span>
              </div>
              <div>${rows}</div>
              <div class="add-area mt-1" data-category="${escapeHtml(name)}">
                <button type="button" class="flex min-h-[48px] w-full items-center gap-3 px-1 text-left text-sm text-muted" data-action="open-add" aria-label="Add item to ${escapeHtml(name)}">
                  <span class="flex h-6 w-6 items-center justify-center rounded-full border border-[#cbd2c8] text-[19px] leading-none text-leaf" aria-hidden="true">+</span>
                  <span>Add an item</span>
                </button>
              </div>
            </section>`;
        }).join('');
      }

      function renderMeals() {
        const count = state.meals.length;
        mealPlanCount.textContent = `${count} ${count === 1 ? 'meal' : 'meals'}`;
        mealPlanToggle.setAttribute('aria-expanded', String(!state.mealsCollapsed));
        mealPlanContent.hidden = state.mealsCollapsed;
        mealPlanChevron.textContent = state.mealsCollapsed ? '›' : '⌄';
        mealsEl.innerHTML = state.meals.map(meal => `
          <div class="flex min-h-[48px] items-center gap-2">
            <button type="button" class="min-h-[48px] min-w-0 flex-1 py-2 text-left text-[16px] text-ink" data-action="edit-meal" data-id="${escapeHtml(meal.id)}">${escapeHtml(meal.label)}</button>
            <button type="button" class="min-h-11 min-w-11 rounded-lg text-lg text-muted" data-action="delete-meal" data-id="${escapeHtml(meal.id)}" aria-label="Delete ${escapeHtml(meal.label)}" title="Delete meal">&times;</button>
          </div>`).join('');
      }

      function startMealEditing(button) {
        const meal = state.meals.find(entry => entry.id === button.dataset.id);
        if (!meal) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = meal.label;
        input.maxLength = 100;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `Edit ${meal.label}`);
        input.className = 'min-h-[48px] min-w-0 flex-1 border-0 bg-transparent py-2 text-ink outline-none';
        button.replaceWith(input);
        let saved = false;
        const finish = commit => {
          if (saved) return;
          saved = true;
          const label = input.value.trim();
          if (commit && label) meal.label = label;
          if (commit && label) persist();
          renderMeals();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); finish(true); }
          if (event.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
        focusInput(input);
      }

      function openMealAdd() {
        if (mealAddArea.querySelector('input')) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Add a meal';
        input.maxLength = 100;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', 'New meal');
        input.className = 'min-h-[48px] w-full border-b border-leaf/40 bg-transparent text-ink placeholder:text-muted/70 outline-none';
        mealAddArea.replaceChildren(input);
        const add = () => {
          const label = input.value.trim();
          if (!label) return;
          state.meals.push({ id: makeId(), label });
          persist();
          renderMeals();
          openMealAdd();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); add(); }
          if (event.key === 'Escape') render();
        });
        input.addEventListener('blur', () => {
          if (!input.value.trim() && input.isConnected) render();
        });
        focusInput(input);
      }

      function finishReorder() {
        if (!dragState) return;
        dragState.section.classList.remove('is-dragging');
        categoriesEl.querySelectorAll('.drop-target').forEach(section => section.classList.remove('drop-target'));
        state.categoryOrder = [...categoriesEl.querySelectorAll('.category')].map(section => section.dataset.category);
        dragState = null;
        persist();
        render();
      }

      function focusInput(input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }

      function startEditing(button) {
        const item = state.active.find(entry => entry.id === button.dataset.id);
        if (!item) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = item.label;
        input.maxLength = 80;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `Edit ${item.label}`);
        input.className = 'min-h-[48px] min-w-0 flex-1 border-0 bg-transparent px-0 text-ink outline-none';
        button.replaceWith(input);
        let saved = false;
        const save = () => {
          if (saved) return;
          saved = true;
          const nextLabel = input.value.trim();
          if (nextLabel) item.label = nextLabel;
          persist();
          render();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
          if (event.key === 'Escape') { input.value = item.label; input.blur(); }
        });
        input.addEventListener('blur', save);
        focusInput(input);
      }

      function startRename(button) {
        const section = button.closest('.category');
        const oldName = section?.dataset.category;
        if (!oldName) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = oldName;
        input.maxLength = 40;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `Rename ${oldName}`);
        input.className = 'min-h-11 w-full min-w-0 border-b border-leaf/40 bg-transparent text-ink outline-none';
        button.replaceWith(input);
        let saved = false;
        const finish = commit => {
          if (saved) return;
          saved = true;
          const nextName = input.value.trim();
          const duplicate = state.categories.some(name => name !== oldName && name.toLocaleLowerCase() === nextName.toLocaleLowerCase());
          if (commit && nextName && !duplicate) {
            state.categories = state.categories.map(name => name === oldName ? nextName : name);
            state.categoryOrder = state.categoryOrder.map(name => name === oldName ? nextName : name);
            state.categoryColors[nextName] = state.categoryColors[oldName];
            delete state.categoryColors[oldName];
            [...state.active, ...state.archive].forEach(item => {
              if (item.category === oldName) item.category = nextName;
            });
            persist();
          }
          render();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); finish(true); }
          if (event.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(true));
        focusInput(input);
      }

      function openCategoryAdd(area) {
        if (area.querySelector('input')) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'New group name';
        input.maxLength = 40;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', 'New category name');
        input.className = 'min-h-11 w-full border-b border-leaf/40 bg-transparent px-1 text-ink placeholder:text-muted/70 outline-none';
        const status = document.createElement('p');
        status.className = 'px-1 pt-1 text-xs text-tomato';
        status.setAttribute('aria-live', 'polite');
        area.replaceChildren(input, status);
        let saved = false;
        const add = () => {
          if (saved) return;
          const name = input.value.trim();
          if (!name) return;
          if (state.categories.some(category => category.toLocaleLowerCase() === name.toLocaleLowerCase())) {
            status.textContent = 'A group with that name already exists.';
            return;
          }
          saved = true;
          state.categories.push(name);
          state.categoryOrder.push(name);
          state.categoryColors[name] = chooseUnusedColorIndex(new Set(Object.values(state.categoryColors)));
          persist();
          render();
          openCategoryAdd(document.querySelector('#add-category-area'));
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); add(); }
          if (event.key === 'Escape') render();
        });
        input.addEventListener('blur', () => {
          if (input.value.trim()) add();
          else if (input.isConnected) render();
        });
        focusInput(input);
      }

      function openAdd(area) {
        if (area.querySelector('input')) return;
        const category = area.dataset.category;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Add an item';
        input.maxLength = 80;
        input.autocomplete = 'off';
        input.setAttribute('aria-label', `New item in ${category}`);
        input.className = 'min-h-[48px] w-full border-0 border-b border-leaf/40 bg-transparent px-1 text-ink placeholder:text-muted/70 outline-none';
        area.innerHTML = '';
        area.append(input);

        const addItem = () => {
          const label = input.value.trim();
          if (!label) return;
          state.active.push({ id: makeId(), label, category });
          persist();
          render();
          const nextArea = [...categoriesEl.querySelectorAll('.add-area')].find(element => element.dataset.category === category);
          openAdd(nextArea);
        };

        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); addItem(); }
          if (event.key === 'Escape') render();
        });
        input.addEventListener('blur', () => {
          if (!input.value.trim() && input.isConnected) render();
        });
        focusInput(input);
      }

      categoriesEl.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        if (target.dataset.action === 'edit') startEditing(target);
        if (target.dataset.action === 'rename') startRename(target);
        if (target.dataset.action === 'open-add') openAdd(target.closest('.add-area'));
      });

      document.querySelector('#add-category-area').addEventListener('click', event => {
        if (event.target.closest('[data-action="open-category-add"]')) openCategoryAdd(event.currentTarget);
      });

      mealsEl.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        if (target.dataset.action === 'edit-meal') startMealEditing(target);
        if (target.dataset.action === 'delete-meal') {
          state.meals = state.meals.filter(meal => meal.id !== target.dataset.id);
          persist();
          renderMeals();
        }
      });

      mealAddArea.addEventListener('click', event => {
        if (event.target.closest('[data-action="open-meal-add"]')) openMealAdd();
      });

      mealPlanToggle.addEventListener('click', () => {
        state.mealsCollapsed = !state.mealsCollapsed;
        persist();
        renderMeals();
      });

      categoriesEl.addEventListener('pointerdown', event => {
        const handle = event.target.closest('[data-action="drag"]');
        if (!handle || event.button !== 0) return;
        const section = handle.closest('.category');
        if (!section) return;
        event.preventDefault();
        dragState = { section, pointerId: event.pointerId, handle };
        section.classList.add('is-dragging');
        handle.setPointerCapture(event.pointerId);
      });

      categoriesEl.addEventListener('pointermove', event => {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        const sections = [...categoriesEl.querySelectorAll('.category')].filter(section => section !== dragState.section);
        const nextSection = sections.find(section => event.clientY < section.getBoundingClientRect().top + section.getBoundingClientRect().height / 2);
        categoriesEl.querySelectorAll('.drop-target').forEach(section => section.classList.remove('drop-target'));
        if (nextSection) {
          categoriesEl.insertBefore(dragState.section, nextSection);
          nextSection.classList.add('drop-target');
        } else {
          categoriesEl.append(dragState.section);
          sections.at(-1)?.classList.add('drop-target');
        }
        const edge = 64;
        if (event.clientY < edge) window.scrollBy(0, -12);
        else if (event.clientY > window.innerHeight - edge) window.scrollBy(0, 12);
      });

      categoriesEl.addEventListener('pointerup', event => {
        if (dragState && event.pointerId === dragState.pointerId) finishReorder();
      });

      categoriesEl.addEventListener('pointercancel', event => {
        if (dragState && event.pointerId === dragState.pointerId) finishReorder();
      });

      categoriesEl.addEventListener('change', event => {
        const checkbox = event.target.closest('input[data-action="archive"]');
        if (!checkbox?.checked) return;
        const index = state.active.findIndex(item => item.id === checkbox.dataset.id);
        if (index === -1) return;
        const [item] = state.active.splice(index, 1);
        item.checked = true;
        item.archivedAt = Date.now();
        state.archive.push(item);
        persist();
        render();
      });

      clearDoneButton.addEventListener('click', () => {
        state.archive = [];
        persist();
        render();
      });

      document.querySelector('#today').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());
      persist();
      render();
    })();
  </script>
</body>
</html>
